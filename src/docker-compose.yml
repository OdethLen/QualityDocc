version: '3.8'

services:
  # Tu parte: El cerebro del sistema
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: QualityDoc_SQLServer
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=Document2026!
    ports:
      - "1441:1433"
    volumes:
      - mssql_data:/var/opt/mssql

  admin-net:
    build: 
      context: ./modulo-central
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    volumes:
      - uploads_shared:/app/wwwroot/uploads

  # El "hueco" para tus compañeros
  portal-php:
    image: php:8.2-apache
    volumes:
      - uploads_shared:/var/www/html/uploads

  indexador-node:
    image: node:18
    volumes:
      - uploads_shared:/app/docs

volumes:
  mssql_data:
  uploads_shared: